name: Release

# release-please keeps a release PR off master that bumps package.json and
# CHANGELOG.md from conventional commits. Merging it creates the vX.Y.Z tag
# and GitHub Release, and this workflow then attaches the static build.
# Versions and tags are this repo's own, independent of logistics-backend
# and logistics-android.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build (root-relative)
        env:
          VITE_BASE: /
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          tar -C dist -czf "frontend-${{ needs.release-please.outputs.version }}.tar.gz" .
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "frontend-${{ needs.release-please.outputs.version }}.tar.gz" --clobber
