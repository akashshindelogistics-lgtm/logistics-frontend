name: Pages

# The dashboard on GitHub Pages, at https://<owner>.github.io/<repo>/.
# Every branch builds (a broken build fails CI); only master deploys.
# Pages must be set to "GitHub Actions" once: Settings → Pages. The API docs
# (Swagger UI) are published by logistics-backend.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Repo variable: Settings → Secrets and variables → Actions → Variables,
          # e.g. https://logi-api.duckdns.org/api
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set; the built app would call the wrong origin."
            exit 1
          fi
          npm run build
          # SPA fallback: unknown deep links 404 on Pages otherwise.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
