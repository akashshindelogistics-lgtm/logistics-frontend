name: Unit Tests

# Type-check, lint and Vitest. Runs on a push to any branch, so a feature
# branch gets feedback before a pull request; pull_request only for forks,
# which can't trigger `push` on this repo.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Type-check, lint and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm run test:unit
