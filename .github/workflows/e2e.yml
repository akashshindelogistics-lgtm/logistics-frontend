name: E2E Tests (Playwright)

# The Playwright suite needs the real API, which lives in logistics-backend:
# check it out (master, or the backend_ref input), build it, and run it next
# to MySQL. The GHCR image isn't used: it is built for arm64 only.
#
# Also runs daily, so an API change that breaks the dashboard shows up even
# when nothing changed here.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'logistics-backend branch, tag or SHA to test against'
        default: master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BACKEND_REPO: akashshindelogistics-lgtm/logistics-backend

jobs:
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: logistics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout API (logistics-backend)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ inputs.backend_ref || 'master' }}
          path: backend

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build the API
        working-directory: backend
        run: |
          cargo build --bin logistics-system --release
          echo "Testing against logistics-backend $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword --silent 2>/dev/null && exit 0
            sleep 2
          done
          echo "::error::MySQL failed to become ready"; exit 1

      - name: Start the API
        working-directory: backend
        run: ./target/release/logistics-system &
        env:
          # Release builds require JWT_SECRET (>= 32 chars). Throwaway value for
          # this ephemeral CI backend, not a real secret.
          JWT_SECRET: ci-e2e-jwt-secret-not-a-real-secret-0123456789
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Agents run against tests/fake-model.mjs, not Claude.
          AGENT_MODEL_URL: http://127.0.0.1:8799/v1/messages
          # Customer messages link to the tracking page on the Vite server.
          PUBLIC_APP_URL: http://localhost:5173

      - name: Wait for the API
        run: |
          for i in {1..20}; do
            curl -sf http://127.0.0.1:8080/api/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::The API failed to start within 20 seconds"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server
        run: |
          node tests/fake-model.mjs &
          npm run dev &

      - name: Wait for Vite
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:5173 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::Vite dev server failed to start within 30 seconds"; exit 1

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces / screenshots)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
